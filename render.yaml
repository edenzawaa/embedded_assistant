services:
  - type: web
    name: flask-voice-assistant
    env: python
    plan: free
    buildCommand: |
      apt-get update && apt-get install -y ffmpeg
      pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 2
    envVars:
      - key: GEMINI_API_KEY
        sync: false
